<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>SAKE LOG</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#202020;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#191919;color:white;padding:22px 18px}header h1{margin:0;letter-spacing:3px;font-size:27px}header small{color:#c8c8c8}main{max-width:720px;margin:auto;padding:18px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:20px}button{border:0;border-radius:12px;padding:11px 14px;background:#e7e4df;color:#222;font-weight:650;cursor:pointer;white-space:nowrap}button.active,.primary{background:#222;color:#fff}.card{background:white;border:1px solid #e8e6e0;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 2px 8px #00000005}input,textarea,select{display:block;width:100%;padding:12px;margin:7px 0 13px;border:1px solid #d9d6cf;border-radius:10px;font:inherit;background:white}textarea{min-height:75px}label{font-size:13px;font-weight:650}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#777;font-size:13px}.stat{font-size:26px;font-weight:800}.tabs{display:flex;gap:8px}.hidden{display:none}.chip{display:inline-block;border-radius:20px;background:#f0ede7;padding:5px 9px;font-size:12px;margin:4px 4px 4px 0}.empty{text-align:center;color:#777;padding:36px 10px}.danger{color:#b43a3a}.tiny{font-size:12px}h2{font-size:21px;margin:5px 0 16px}h3{margin:0 0 8px}.post-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.post-actions button{padding:8px 11px;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:400px){main{padding:12px}nav button{padding:10px}} </style></head><body><header><div class="row"><div><h1>SAKE LOG</h1><small id="tagline">Discover. Taste. Remember.</small></div><button id="langBtn" style="background:#444;color:white" onclick="toggleLang()">EN</button></div></header><main><p class="muted">SAKE LOG · Prototype / 試作品 · 20歳以上向け / Legal drinking age only</p><nav id="nav"></nav><section id="content"></section></main><script>
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}const KEY='sakelog_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{drinks:[],wishlist:[],posts:[],profile:{name:'SAKE Explorer',bio:''}}}catch{db={drinks:[],wishlist:[],posts:[],profile:{name:'SAKE Explorer',bio:''}}}let lang=localStorage.getItem('sakelog_lang')||'ja',tab='home',editId=null;const t=(ja,en)=>lang==='ja'?ja:en;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert(t('保存容量が不足しています。写真を減らすかバックアップしてください。この変更は保存されていません。','Storage is full. Reduce photos or export a backup. This change was not saved.'));return false}}function toggleLang(){lang=lang==='ja'?'en':'ja';localStorage.setItem('sakelog_lang',lang);render()}function go(x){tab=x;editId=null;render()}function render(){document.documentElement.lang=lang;document.getElementById('langBtn').textContent=lang==='ja'?'EN':'日本語';let items=[['home',t('ホーム','Home')],['add',t('記録する','Log drink')],['feed',t('フィード','Feed')],['calendar',t('カレンダー','Calendar')],['wish',t('飲みたい','Wishlist')],['profile',t('プロフィール','Profile')]];document.getElementById('nav').innerHTML=items.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');let el=document.getElementById('content');if(tab==='home')home(el);if(tab==='add')form(el);if(tab==='feed')feed(el);if(tab==='wish')wish(el);if(tab==='profile')profile(el);if(tab==='calendar')calendar(el)}function home(el){let drinks=[...db.drinks].sort((a,b)=>b.date.localeCompare(a.date));let types=[...new Set(drinks.map(d=>d.type))];el.innerHTML=`<h2>${t('マイコレクション','My collection')}</h2><div class="split"><div class="card"><div class="muted">${t('飲んだお酒','Drinks logged')}</div><div class="stat">${drinks.length}</div></div><div class="card"><div class="muted">${t('お酒の種類','Types tried')}</div><div class="stat">${types.length}</div></div></div><div class="card"><h3>${t('おすすめ','Recommendation')}</h3><p>${drinks.length?recommend(drinks):t('まず1杯記録すると、好みに合わせた提案が表示されます。','Log your first drink to get a suggestion.')}</p><div class="muted tiny">${t('記録に基づく簡易提案（AI連携は今後追加）','Simple rule-based suggestion (AI coming later)')}</div></div><h3>${t('最近の記録','Recent drinks')}</h3>${drinks.length?drinks.map(d=>drinkCard(d)).join(''):`<div class="card empty">${t('まだ記録がありません。最初の1杯を登録しよう！','No drinks yet. Log your first one!')}</div>`}`};function recommend(ds){let top=ds.slice().sort((a,b)=>Number(b.rating)-Number(a.rating))[0];return t(`「${esc(top.name)}」が高評価！次は同じ「${esc(top.type)}」系を探してみよう。`,`You rated “${esc(top.name)}” highly! Try another ${esc(top.type)}.`)}function drinkCard(d){return `<div class="card"><div class="row"><div><h3>${esc(d.name)}</h3><span class="muted">${esc(d.date)} · ${esc(d.type)}</span></div><strong>★ ${esc(d.rating)}/5</strong></div><div>${d.brand?`<span class="chip">${esc(d.brand)}</span>`:''}${d.amount?`<span class="chip">${esc(d.amount)} ml</span>`:''}</div>${d.photo?`<img src="${d.photo}" alt="${esc(d.name)}" style="width:100%;max-height:320px;object-fit:contain;border-radius:12px">`:''}<p>${esc(d.note)}</p><div class="post-actions"><button onclick="editDrink('${d.id}')">${t('編集','Edit')}</button><button onclick="shareDrink('${d.id}')">${t('投稿する','Post')}</button><button class="danger" onclick="removeDrink('${d.id}')">${t('削除','Delete')}</button></div></div>`}function form(el){photoPending=false;let d=db.drinks.find(x=>x.id===editId)||{};draftPhoto=d.photo||'';el.innerHTML=`<h2>${editId?t('記録を編集','Edit drink'):t('お酒を記録','Log a drink')}</h2><form class="card" onsubmit="submitDrink(event)"><label>${t('お酒の名前','Drink name')} *</label><input name="name" required maxlength="100" value="${esc(d.name||'')}" placeholder="例：獺祭 45"><label>${t('ブランド・蔵元','Brand / producer')}</label><input name="brand" maxlength="100" value="${esc(d.brand||'')}"><label>${t('種類','Type')}</label><select name="type">${['日本酒','ビール','ワイン','ウイスキー','焼酎','カクテル','その他'].map((v,i)=>`<option value="${v}" ${d.type===v?'selected':''}>${t(v,['Sake','Beer','Wine','Whisky','Shochu','Cocktail','Other'][i])}</option>`).join('')}</select><div class="split"><div><label>${t('飲んだ日','Date')}</label><input name="date" type="date" required value="${esc(d.date||localDate())}"></div><div><label>${t('飲酒量 (ml)','Amount (ml)')}</label><input name="amount" type="number" min="0" max="100000" step="1" value="${esc(d.amount||'')}"></div></div><label>${t('評価','Rating')}</label><select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}" ${Number(d.rating||4)===n?'selected':''}>${'★'.repeat(n)} (${n}/5)</option>`).join('')}</select><label>${t('写真（撮影・選択）','Photo (camera / library)')}</label><input type="file" accept="image/*" onchange="pickPhoto(this)"><div id="photoStatus" class="muted"></div><label>${t('アルコール度数 (%)','Alcohol by volume (%)')}</label><input name="abv" type="number" min="0" max="100" step="0.1" value="${esc(d.abv||'')}"><label>${t('感想・香り・味','Notes')}</label><textarea name="note" maxlength="1000">${esc(d.note||'')}</textarea><button class="primary" type="submit">${t('保存する','Save')}</button></form>`}function submitDrink(e){e.preventDefault();if(photoPending){alert(t('写真の処理中です','Photo is processing'));return}let f=new FormData(e.target),d={id:editId||crypto.randomUUID(),photo:draftPhoto,abv:Number(f.get('abv'))||0,name:String(f.get('name')).trim(),brand:String(f.get('brand')).trim(),type:f.get('type'),date:f.get('date'),amount:f.get('amount'),rating:f.get('rating'),note:String(f.get('note')).trim()};if(!d.name)return;if(editId)db.drinks=db.drinks.map(x=>x.id===editId?d:x);else db.drinks.push(d);if(save())go('home')}function editDrink(id){editId=id;tab='add';render()}function removeDrink(id){if(confirm(t('この記録を削除しますか？','Delete this drink?'))){db.drinks=db.drinks.filter(d=>d.id!==id);save();render()}}function shareDrink(id){let d=db.drinks.find(x=>x.id===id);if(!d)return;db.posts.unshift({id:String(Date.now()),drinkId:id,name:d.name,comment:d.note,author:db.profile.name,likes:0,liked:false,comments:[],date:localDate()});save();go('feed')}function feed(el){el.innerHTML=`<h2>${t('みんなの投稿（デモ）','Community feed (demo)')}</h2><p class="muted">${t('この段階では自分の端末内だけの投稿です。ほかのユーザーには公開されません。','Posts are stored only on this device and are not public yet.')}</p>${db.posts.length?db.posts.map(p=>`<div class="card"><div class="muted">@${esc(p.author)} · ${esc(p.date)}</div><h3>${esc(p.name)}</h3><p>${esc(p.comment)}</p><div class="post-actions"><button onclick="likePost('${p.id}')">${p.liked?'❤️':'♡'} ${p.likes}</button><button onclick="commentPost('${p.id}')">${t('コメント','Comment')} (${p.comments.length})</button><button onclick="deletePost('${p.id}')">${t('削除','Delete')}</button></div>${p.comments.map(c=>`<p class="muted">💬 ${esc(c)}</p>`).join('')}</div>`).join(''):`<div class="card empty">${t('記録から「投稿する」を押してみよう','Tap “Post” on a logged drink to share it here.')}</div>`}`}function likePost(id){let p=db.posts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()}function commentPost(id){let v=prompt(t('コメントを入力','Write a comment'));if(v&&v.trim()){db.posts.find(x=>x.id===id).comments.push(v.trim().slice(0,300));save();render()}}function deletePost(id){if(confirm(t('投稿を削除しますか？','Delete post?'))){db.posts=db.posts.filter(p=>p.id!==id);save();render()}}function wish(el){el.innerHTML=`<h2>${t('飲みたいリスト','Wishlist')}</h2><form class="card" onsubmit="addWish(event)"><label>${t('飲んでみたいお酒','Drink to try')}</label><input name="name" maxlength="100" required placeholder="${t('お酒の名前','Drink name')}"><button class="primary">${t('追加','Add')}</button></form>${db.wishlist.map(w=>`<div class="card row"><strong>${esc(w.name)}</strong><button onclick="removeWish('${w.id}')">${t('削除','Remove')}</button></div>`).join('')}`}function addWish(e){e.preventDefault();let name=new FormData(e.target).get('name').trim();if(name){db.wishlist.push({id:String(Date.now()),name});save();render()}}function removeWish(id){db.wishlist=db.wishlist.filter(x=>x.id!==id);save();render()}function profile(el){let total=db.drinks.reduce((s,d)=>s+(Number(d.amount)||0),0);el.innerHTML=`<h2>${t('プロフィール','Profile')}</h2><p class="muted">${t('SNSデモ：他端末との同期はありません','SNS demo: no sync across devices')}</p><div class="card"><h3>${t('探検仲間（デモ）','Explorers (demo)')}</h3>${['Sake Kyoto','Craft Beer Tokyo','Wine Osaka'].map((n,i)=>`<p>${n} <button onclick="follow(${i})">${(db.following||[]).includes(i)?t('フォロー中','Following'):t('フォロー','Follow')}</button></p>`).join('')}</div><form class="card" onsubmit="saveProfile(event)"><label>${t('表示名','Display name')}</label><input name="name" required maxlength="50" value="${esc(db.profile.name)}"><label>${t('自己紹介','Bio')}</label><textarea name="bio" maxlength="300">${esc(db.profile.bio)}</textarea><button class="primary">${t('保存','Save')}</button></form><div class="card"><h3>${t('マイデータ','My stats')}</h3><p>${t('記録数','Logged drinks')}: <strong>${db.drinks.length}</strong></p><p>${t('登録した飲酒量の合計','Total logged volume')}: <strong>${total.toLocaleString()} ml</strong></p><p>${t('飲みたいリスト','Wishlist')}: <strong>${db.wishlist.length}</strong></p><p class="muted tiny">${t('データはこのブラウザに保存されます。ブラウザのデータを消すと記録も消える場合があります。','Data is saved in this browser. Clearing browser data may erase your records.')}</p><button onclick="exportData()">${t('バックアップを保存','Export backup')}</button></div>`}function saveProfile(e){e.preventDefault();let f=new FormData(e.target);db.profile={name:String(f.get('name')).trim(),bio:String(f.get('bio')).trim()};save();render()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sake-log-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
let draftPhoto='',photoPending=false;
async function pickPhoto(input){const file=input.files[0];if(!file)return;photoPending=true;const status=document.getElementById('photoStatus');status.textContent=t('処理中…','Processing…');try{if(file.size>25000000)throw Error();draftPhoto=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ratio=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.65))};im.onerror=()=>{URL.revokeObjectURL(url);reject()};im.src=url});status.textContent=t('写真を追加しました','Photo added')}catch{status.textContent=t('読み込めません。別の写真を選んでください','Could not load. Choose another photo.')}finally{photoPending=false}}
function follow(i){db.following=db.following||[];db.following=db.following.includes(i)?db.following.filter(x=>x!==i):[...db.following,i];save();render()}
let month=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
function calendar(el){const ds=db.drinks.filter(d=>d.date.startsWith(month)),volume=ds.reduce((a,d)=>a+Number(d.amount||0),0),alcohol=ds.reduce((a,d)=>a+Number(d.amount||0)*Number(d.abv||0)/100*0.8,0);const [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate(),offset=new Date(y,m-1,1).getDay();el.innerHTML=`<h2>${t('カレンダー・月別集計','Calendar & monthly stats')}</h2><input aria-label="Month" type="month" value="${month}" onchange="month=this.value||month;render()"><div class="card"><div class="stat">${volume.toLocaleString()} ml</div><p>${ds.length} ${t('記録','logs')} · ${new Set(ds.map(d=>d.date)).size} ${t('記録した日','days logged')}</p><p>${t('純アルコール量（概算）','Estimated pure alcohol')}: ${alcohol.toFixed(1)} g</p><p class="muted">${t('度数未入力の記録は純アルコール集計から除外。記録がない日も未入力の可能性があります。','Logs without ABV are excluded from alcohol totals. Empty dates may be unlogged.')}</p></div><div class="card" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${t('日,月,火,水,木,金,土','Sun,Mon,Tue,Wed,Thu,Fri,Sat').split(',').map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0'),n=ds.filter(d=>d.date===date).length;return `<button style="padding:9px 2px;background:${n?'#e7cba7':'#f3f1ec'}" onclick="showDay('${date}')">${i+1}<br><small>${n?'● '+n:'·'}</small></button>`}).join('')}</div><div id="dayLogs">${ds.map(drinkCard).join('')}</div>`}
function showDay(date){document.getElementById('dayLogs').innerHTML=`<h3>${date}</h3>`+db.drinks.filter(d=>d.date===date).map(drinkCard).join('')}

render();
</script></body></html>
