<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>SAKE LOG</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#202020;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{background:#191919;color:white;padding:22px 18px}header h1{margin:0;letter-spacing:3px;font-size:27px}header small{color:#c8c8c8}main{max-width:720px;margin:auto;padding:18px}nav{display:flex;gap:7px;overflow:auto;margin-bottom:20px}button{border:0;border-radius:12px;padding:11px 14px;background:#e7e4df;color:#222;font-weight:650;cursor:pointer;white-space:nowrap}button.active,.primary{background:#222;color:#fff}.card{background:white;border:1px solid #e8e6e0;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 2px 8px #00000005}input,textarea,select{display:block;width:100%;padding:12px;margin:7px 0 13px;border:1px solid #d9d6cf;border-radius:10px;font:inherit;font-size:16px;background:white}textarea{min-height:75px}label{font-size:13px;font-weight:650}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#777;font-size:13px}.stat{font-size:26px;font-weight:800}.tabs{display:flex;gap:8px}.hidden{display:none}.chip{display:inline-block;border-radius:20px;background:#f0ede7;padding:5px 9px;font-size:12px;margin:4px 4px 4px 0}.empty{text-align:center;color:#777;padding:36px 10px}.danger{color:#b43a3a}.tiny{font-size:12px}h2{font-size:21px;margin:5px 0 16px}h3{margin:0 0 8px}.post-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.post-actions button{padding:8px 11px;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:400px){main{padding:12px}nav button{padding:10px}} button:disabled{opacity:.5;cursor:wait}#accountBar{border-left:4px solid #8a6745}#accountBar p:empty{display:none}#accountBar .muted{overflow-wrap:anywhere}</style></head><body><header><div class="row"><div><h1>SAKE LOG</h1><small id="tagline">Discover. Taste. Remember.</small></div><button id="langBtn" style="background:#444;color:white" onclick="toggleLang()">EN</button></div></header><main><p class="muted">SAKE LOG · Auto-save / 自動保存版 · 20歳以上向け / Legal drinking age only</p><aside id="accountBar" class="card"></aside><nav id="nav"></nav><section id="content"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><script>
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}const KEY='sakelog_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{drinks:[],wishlist:[],posts:[],profile:{name:'SAKE Explorer',bio:''}}}catch{db={drinks:[],wishlist:[],posts:[],profile:{name:'SAKE Explorer',bio:''}}}let lang=localStorage.getItem('sakelog_lang')||'ja',tab='home',editId=null;const t=(ja,en)=>lang==='ja'?ja:en;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert(t('保存容量が不足しています。写真を減らすかバックアップしてください。この変更は保存されていません。','Storage is full. Reduce photos or export a backup. This change was not saved.'));return false}}function toggleLang(){lang=lang==='ja'?'en':'ja';localStorage.setItem('sakelog_lang',lang);render()}function go(x){tab=x;editId=null;render()}function render(){document.documentElement.lang=lang;document.getElementById('langBtn').textContent=lang==='ja'?'EN':'日本語';let items=[['home',t('ホーム','Home')],['add',t('記録する','Log drink')],['feed',t('フィード','Feed')],['calendar',t('カレンダー','Calendar')],['wish',t('飲みたい','Wishlist')],['profile',t('プロフィール','Profile')]];document.getElementById('nav').innerHTML=items.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('');let el=document.getElementById('content');if(tab==='home')home(el);if(tab==='add')form(el);if(tab==='feed')feed(el);if(tab==='wish')wish(el);if(tab==='profile')profile(el);if(tab==='calendar')calendar(el)}function home(el){let drinks=[...db.drinks].sort((a,b)=>b.date.localeCompare(a.date));let types=[...new Set(drinks.map(d=>d.type))];el.innerHTML=`<h2>${t('マイコレクション','My collection')}</h2><div class="split"><div class="card"><div class="muted">${t('飲んだお酒','Drinks logged')}</div><div class="stat">${drinks.length}</div></div><div class="card"><div class="muted">${t('お酒の種類','Types tried')}</div><div class="stat">${types.length}</div></div></div><div class="card"><h3>${t('おすすめ','Recommendation')}</h3><p>${drinks.length?recommend(drinks):t('まず1杯記録すると、好みに合わせた提案が表示されます。','Log your first drink to get a suggestion.')}</p><div class="muted tiny">${t('記録に基づく簡易提案（AI連携は今後追加）','Simple rule-based suggestion (AI coming later)')}</div></div><h3>${t('最近の記録','Recent drinks')}</h3>${drinks.length?drinks.map(d=>drinkCard(d)).join(''):`<div class="card empty">${t('まだ記録がありません。最初の1杯を登録しよう！','No drinks yet. Log your first one!')}</div>`}`};function recommend(ds){let top=ds.slice().sort((a,b)=>Number(b.rating)-Number(a.rating))[0];return t(`「${esc(top.name)}」が高評価！次は同じ「${esc(top.type)}」系を探してみよう。`,`You rated “${esc(top.name)}” highly! Try another ${esc(top.type)}.`)}function drinkCard(d){return `<div class="card"><div class="row"><div><h3>${esc(d.name)}</h3><span class="muted">${esc(d.date)} · ${esc(d.type)}</span></div><strong>★ ${esc(d.rating)}/5</strong></div><div>${d.brand?`<span class="chip">${esc(d.brand)}</span>`:''}${d.amount?`<span class="chip">${esc(d.amount)} ml</span>`:''}</div>${d.photo?`<img src="${esc(d.photo)}" alt="${esc(d.name)}" style="width:100%;max-height:320px;object-fit:contain;border-radius:12px">`:''}<p>${esc(d.note)}</p><div class="post-actions"><button onclick="editDrink('${d.id}')">${t('編集','Edit')}</button><button onclick="shareDrink('${d.id}')">${t('投稿する','Post')}</button><button class="danger" onclick="removeDrink('${d.id}')">${t('削除','Delete')}</button></div></div>`}function form(el){photoPending=false;let d=db.drinks.find(x=>x.id===editId)||{};draftPhoto=d.photo||'';el.innerHTML=`<h2>${editId?t('記録を編集','Edit drink'):t('お酒を記録','Log a drink')}</h2><form class="card" onsubmit="submitDrink(event)"><label>${t('お酒の名前','Drink name')} *</label><input name="name" required maxlength="100" value="${esc(d.name||'')}" placeholder="例：獺祭 45"><label>${t('ブランド・蔵元','Brand / producer')}</label><input name="brand" maxlength="100" value="${esc(d.brand||'')}"><label>${t('種類','Type')}</label><select name="type">${['日本酒','ビール','ワイン','ウイスキー','焼酎','カクテル','その他'].map((v,i)=>`<option value="${v}" ${d.type===v?'selected':''}>${t(v,['Sake','Beer','Wine','Whisky','Shochu','Cocktail','Other'][i])}</option>`).join('')}</select><div class="split"><div><label>${t('飲んだ日','Date')}</label><input name="date" type="date" required value="${esc(d.date||localDate())}"></div><div><label>${t('飲酒量 (ml)','Amount (ml)')}</label><input name="amount" type="number" min="0" max="100000" step="1" value="${esc(d.amount||'')}"></div></div><label>${t('評価','Rating')}</label><select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}" ${Number(d.rating||4)===n?'selected':''}>${'★'.repeat(n)} (${n}/5)</option>`).join('')}</select><label>${t('写真（撮影・選択）','Photo (camera / library)')}</label><input type="file" accept="image/*" onchange="pickPhoto(this)"><div id="photoStatus" class="muted"></div><label>${t('アルコール度数 (%)','Alcohol by volume (%)')}</label><input name="abv" type="number" min="0" max="100" step="0.1" value="${esc(d.abv||'')}"><label>${t('感想・香り・味','Notes')}</label><textarea name="note" maxlength="1000">${esc(d.note||'')}</textarea><button class="primary" type="submit">${t('保存する','Save')}</button></form>`}function submitDrink(e){e.preventDefault();if(photoPending){alert(t('写真の処理中です','Photo is processing'));return}let f=new FormData(e.target),d={id:editId||crypto.randomUUID(),photo:draftPhoto,abv:Number(f.get('abv'))||0,name:String(f.get('name')).trim(),brand:String(f.get('brand')).trim(),type:f.get('type'),date:f.get('date'),amount:f.get('amount'),rating:f.get('rating'),note:String(f.get('note')).trim()};if(!d.name)return;if(editId)db.drinks=db.drinks.map(x=>x.id===editId?d:x);else db.drinks.push(d);if(save())go('home')}function editDrink(id){editId=id;tab='add';render()}function removeDrink(id){if(confirm(t('この記録を削除しますか？','Delete this drink?'))){db.drinks=db.drinks.filter(d=>d.id!==id);save();render()}}function shareDrink(id){let d=db.drinks.find(x=>x.id===id);if(!d)return;db.posts.unshift({id:String(Date.now()),drinkId:id,name:d.name,comment:d.note,author:db.profile.name,likes:0,liked:false,comments:[],date:localDate()});save();go('feed')}function feed(el){el.innerHTML=`<h2>${t('みんなの投稿（デモ）','Community feed (demo)')}</h2><p class="muted">${t('投稿機能はデモです。ほかのユーザーには公開されません。','Posts are a demo and are not visible to other users.')}</p>${db.posts.length?db.posts.map(p=>`<div class="card"><div class="muted">@${esc(p.author)} · ${esc(p.date)}</div><h3>${esc(p.name)}</h3><p>${esc(p.comment)}</p><div class="post-actions"><button onclick="likePost('${p.id}')">${p.liked?'❤️':'♡'} ${p.likes}</button><button onclick="commentPost('${p.id}')">${t('コメント','Comment')} (${p.comments.length})</button><button onclick="deletePost('${p.id}')">${t('削除','Delete')}</button></div>${p.comments.map(c=>`<p class="muted">💬 ${esc(c)}</p>`).join('')}</div>`).join(''):`<div class="card empty">${t('記録から「投稿する」を押してみよう','Tap “Post” on a logged drink to share it here.')}</div>`}`}function likePost(id){let p=db.posts.find(x=>x.id===id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()}function commentPost(id){let v=prompt(t('コメントを入力','Write a comment'));if(v&&v.trim()){db.posts.find(x=>x.id===id).comments.push(v.trim().slice(0,300));save();render()}}function deletePost(id){if(confirm(t('投稿を削除しますか？','Delete post?'))){db.posts=db.posts.filter(p=>p.id!==id);save();render()}}function wish(el){el.innerHTML=`<h2>${t('飲みたいリスト','Wishlist')}</h2><form class="card" onsubmit="addWish(event)"><label>${t('飲んでみたいお酒','Drink to try')}</label><input name="name" maxlength="100" required placeholder="${t('お酒の名前','Drink name')}"><button class="primary">${t('追加','Add')}</button></form>${db.wishlist.map(w=>`<div class="card row"><strong>${esc(w.name)}</strong><button onclick="removeWish('${w.id}')">${t('削除','Remove')}</button></div>`).join('')}`}function addWish(e){e.preventDefault();let name=new FormData(e.target).get('name').trim();if(name){db.wishlist.push({id:String(Date.now()),name});save();render()}}function removeWish(id){db.wishlist=db.wishlist.filter(x=>x.id!==id);save();render()}function profile(el){let total=db.drinks.reduce((s,d)=>s+(Number(d.amount)||0),0);el.innerHTML=`<h2>${t('プロフィール','Profile')}</h2><p class="muted">${t('SNSはデモです。自分の記録はアカウント画面からクラウド保存できます。','SNS is a demo. Save your records to cloud from Account.')}</p><div class="card"><h3>${t('探検仲間（デモ）','Explorers (demo)')}</h3>${['Sake Kyoto','Craft Beer Tokyo','Wine Osaka'].map((n,i)=>`<p>${n} <button onclick="follow(${i})">${(db.following||[]).includes(i)?t('フォロー中','Following'):t('フォロー','Follow')}</button></p>`).join('')}</div><form class="card" onsubmit="saveProfile(event)"><label>${t('表示名','Display name')}</label><input name="name" required maxlength="50" value="${esc(db.profile.name)}"><label>${t('自己紹介','Bio')}</label><textarea name="bio" maxlength="300">${esc(db.profile.bio)}</textarea><button class="primary">${t('保存','Save')}</button></form><div class="card"><h3>${t('マイデータ','My stats')}</h3><p>${t('記録数','Logged drinks')}: <strong>${db.drinks.length}</strong></p><p>${t('登録した飲酒量の合計','Total logged volume')}: <strong>${total.toLocaleString()} ml</strong></p><p>${t('飲みたいリスト','Wishlist')}: <strong>${db.wishlist.length}</strong></p><p class="muted tiny">${t('データはこのブラウザに保存されます。ブラウザのデータを消すと記録も消える場合があります。','Data is saved in this browser. Clearing browser data may erase your records.')}</p><button onclick="exportData()">${t('バックアップを保存','Export backup')}</button></div>`}function saveProfile(e){e.preventDefault();let f=new FormData(e.target);db.profile={name:String(f.get('name')).trim(),bio:String(f.get('bio')).trim()};save();render()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sake-log-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
let draftPhoto='',photoPending=false;
async function pickPhoto(input){const file=input.files[0];if(!file)return;photoPending=true;const status=document.getElementById('photoStatus');status.textContent=t('処理中…','Processing…');try{if(file.size>25000000)throw Error();draftPhoto=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ratio=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',0.65))};im.onerror=()=>{URL.revokeObjectURL(url);reject()};im.src=url});status.textContent=t('写真を追加しました','Photo added')}catch{status.textContent=t('読み込めません。別の写真を選んでください','Could not load. Choose another photo.')}finally{photoPending=false}}
function follow(i){db.following=db.following||[];db.following=db.following.includes(i)?db.following.filter(x=>x!==i):[...db.following,i];save();render()}
let month=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
function calendar(el){const ds=db.drinks.filter(d=>d.date.startsWith(month)),volume=ds.reduce((a,d)=>a+Number(d.amount||0),0),alcohol=ds.reduce((a,d)=>a+Number(d.amount||0)*Number(d.abv||0)/100*0.8,0);const [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate(),offset=new Date(y,m-1,1).getDay();el.innerHTML=`<h2>${t('カレンダー・月別集計','Calendar & monthly stats')}</h2><input aria-label="Month" type="month" value="${month}" onchange="month=this.value||month;render()"><div class="card"><div class="stat">${volume.toLocaleString()} ml</div><p>${ds.length} ${t('記録','logs')} · ${new Set(ds.map(d=>d.date)).size} ${t('記録した日','days logged')}</p><p>${t('純アルコール量（概算）','Estimated pure alcohol')}: ${alcohol.toFixed(1)} g</p><p class="muted">${t('度数未入力の記録は純アルコール集計から除外。記録がない日も未入力の可能性があります。','Logs without ABV are excluded from alcohol totals. Empty dates may be unlogged.')}</p></div><div class="card" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${t('日,月,火,水,木,金,土','Sun,Mon,Tue,Wed,Thu,Fri,Sat').split(',').map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0'),n=ds.filter(d=>d.date===date).length;return `<button style="padding:9px 2px;background:${n?'#e7cba7':'#f3f1ec'}" onclick="showDay('${date}')">${i+1}<br><small>${n?'● '+n:'·'}</small></button>`}).join('')}</div><div id="dayLogs">${ds.map(drinkCard).join('')}</div>`}
function showDay(date){document.getElementById('dayLogs').innerHTML=`<h3>${date}</h3>`+db.drinks.filter(d=>d.date===date).map(drinkCard).join('')}

let autoTimer=null,autoBlocked=false,autoRetries=0;

const clone=x=>JSON.parse(JSON.stringify(x));
const blank=()=>({drinks:[],wishlist:[],posts:[],profile:{name:'SAKE Explorer',bio:''},following:[]});
function validData(x){return x&&Array.isArray(x.drinks)&&Array.isArray(x.wishlist)&&Array.isArray(x.posts)&&x.profile&&typeof x.profile.name==='string'}
function readGuest(){try{const x=JSON.parse(localStorage.getItem(KEY));return validData(x)?x:blank()}catch{return blank()}}
function accountKey(){return activeUser?'sakelog_account_'+activeUser.id:KEY}
function localWrite(){const value=activeUser?{data:db,baseRevision,dirty}:db;localStorage.setItem(accountKey(),JSON.stringify(value))}
// Preserve a durable local copy on every edit; cloud upload is explicit.
save=function(){if(authLoading)return false;try{if(activeUser)dirty=true;localWrite();cloudMessage=activeUser?(autoBlocked?t('端末に保存済み・自動保存は停止中。アカウント画面から保存を再試行してください。','Saved on device · auto-save paused. Retry saving from Account.'):t('端末に保存済み・自動保存待ち','Saved on device · waiting to sync')):'';drawAccountBar();autoRetries=0;scheduleAutoSave();return true}catch{alert(t('端末の保存容量が不足しています。バックアップ後に写真を減らしてください。変更は未保存です。','Device storage is full. Export a backup and reduce photos. Changes were not saved.'));return false}};

function drawAccountBar(){const el=document.getElementById('accountBar');if(!el)return;el.innerHTML=`<div class="row"><div><strong>${authLoading?t('読み込み中','Loading'):activeUser?t('ログイン中','Signed in'):t('端末内モード','Device mode')}</strong><div class="muted">${esc(activeUser?activeUser.email||'':t('このブラウザに記録を保存','Records saved in this browser'))}</div></div><button onclick="go('account')">${t('アカウント','Account')}</button></div><p class="muted" role="status">${esc(cloudMessage)}</p>`;}
function errorMessage(error){const raw=String(error?.message||error||'');if(raw.includes('SAKE_LOG_CONFLICT'))return t('別の端末で更新されています。まずバックアップを保存し、「クラウドから読み込む」で最新を確認してください。','Another device saved newer data. Export a backup, then load the latest cloud copy.');if(/Invalid login credentials/i.test(raw))return t('メールアドレスまたはパスワードが違います。','Incorrect email or password.');if(/Email not confirmed/i.test(raw))return t('確認メールのリンクを開いてからログインしてください。','Open your confirmation email before signing in.');if(/rate limit/i.test(raw))return t('送信回数の上限です。しばらく待ってから再試行してください。','Rate limit reached. Please wait and try again.');return t('処理できませんでした：','Request failed: ')+raw.slice(0,300)}
function accountPage(el){if(activeUser){el.innerHTML=`<h2>${t('アカウント・クラウド保存','Account & cloud storage')}</h2><div class="card"><p>${esc(activeUser.email||'')}</p><p id="syncDirty">${dirty?t('端末に未送信の変更があります','You have changes not saved to cloud'):t('未送信の変更はありません','No pending changes')}</p><p id="syncStatus" role="status">${esc(cloudMessage)}</p><div class="post-actions"><button class="primary" onclick="pushCloud()" ${cloudBusy?'disabled':''}>${t('クラウドに保存','Save to cloud')}</button><button onclick="pullCloud()" ${cloudBusy?'disabled':''}>${t('クラウドから読み込む','Load from cloud')}</button><button onclick="exportData()">${t('バックアップを保存','Export backup')}</button></div><p class="muted">${t('変更は端末に保存後、自動でクラウドにも保存します。保存完了の表示を確認してから閉じてください。通信に失敗した場合は再試行し、別端末と競合した場合は停止します。「クラウドに保存」で手動再試行もできます。','Changes are saved on device, then automatically to cloud. Wait for the saved status before closing. Network failures are retried; device conflicts pause sync. Use Save to cloud to retry manually.')}</p></div><div class="card"><h3>${t('最初の試作品の記録を移す','Import original device records')}</h3><p>${t('このブラウザに残る元の記録','Original records in this browser')}: ${readGuest().drinks.length} ${t('件','drinks')}</p><p class="muted">${t('このブラウザに残っている端末内モードのお酒と飲みたいリストを追加します。同じIDは追加しません。元の記録は残ります。','Add drinks and wishlist from device mode in this browser. Existing IDs are skipped and originals are retained.')}</p><button onclick="importGuest()" ${cloudBusy?'disabled':''}>${t('端末の記録を取り込む','Import device records')}</button></div>${recovery?`<form class="card" onsubmit="changePassword(event)"><label>${t('新しいパスワード','New password')}<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button>${t('パスワードを更新','Update password')}</button></form>`:''}<button onclick="logout()" ${cloudBusy?'disabled':''}>${t('ログアウト','Sign out')}</button><p role="status">${esc(authMessage)}</p>`;return}
el.innerHTML=`<h2>${t('ログイン・新規登録','Sign in / Sign up')}</h2><p class="muted">${t('メールアドレスでSAKE LOGのアカウントを作成します。Supabase管理画面のログインとは別です。','Create a SAKE LOG account using your email. This is separate from your Supabase dashboard account.')}</p><form class="card" onsubmit="authenticate(event)"><label>${t('メールアドレス','Email')}<input name="email" type="email" required autocomplete="email" maxlength="254"></label><label>${t('パスワード（8文字以上）','Password (8+ characters)')}<input name="password" type="password" required minlength="8" autocomplete="current-password" maxlength="128"></label><div class="post-actions"><button name="mode" value="login" class="primary" ${!client||cloudBusy?'disabled':''}>${t('ログイン','Sign in')}</button><button name="mode" value="signup" ${!client||cloudBusy?'disabled':''}>${t('新規登録','Sign up')}</button></div><button type="button" onclick="resetPassword(this.form)" ${!client||cloudBusy?'disabled':''}>${t('パスワードを忘れた','Forgot password')}</button></form><p role="status">${esc(authMessage)}</p><p class="muted">${t('クラウドの記録は本人だけが閲覧できます。フィード・いいね・コメント・フォローは引き続きデモです。','Cloud records are private to your account. Feed, likes, comments and follows remain a demo.')}</p>`}
async function authenticate(e){e.preventDefault();if(!client||cloudBusy)return;const f=new FormData(e.target),email=String(f.get('email')).trim(),password=String(f.get('password')),signup=e.submitter?.value==='signup';cloudBusy=true;authMessage=t('処理中…','Working…');render();try{const {data,error}=signup?await client.auth.signUp({email,password,options:{emailRedirectTo:APP_URL}}):await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.session){authMessage='';await loadAccount(data.session);go('account')}else{authMessage=t('確認メールを送りました。メールのリンクを開き、確認後にログインしてください。既に登録済みならログインをお試しください。','Check your confirmation email, open its link, then sign in. If you already registered, try signing in.')}}catch(e){authMessage=errorMessage(e)}finally{cloudBusy=false;render()}}
async function loadAccount(session){const user=session?.user;if(activeUser?.id===user?.id&&!authLoading)return;clearTimeout(autoTimer);autoBlocked=false;autoRetries=0;const seq=++epoch;authLoading=true;activeUser=user||null;cloudMessage='';baseRevision=0;dirty=false;editId=null;tab='account';if(!user){db=readGuest();authLoading=false;render();return}db=blank();let cached=null;try{cached=JSON.parse(localStorage.getItem(accountKey()));if(validData(cached?.data)){db=cached.data;baseRevision=Number(cached.baseRevision)||0;dirty=!!cached.dirty}}catch{}render();try{const {data,error}=await client.from('sake_log_accounts').select('payload,revision').eq('user_id',user.id).maybeSingle();if(seq!==epoch)return;if(error)throw error;if(dirty){cloudMessage=t('端末の未送信データを保持しています。クラウドに保存してください。','Pending device changes retained. Save them to cloud.');if(Number(data?.revision||0)!==baseRevision){autoBlocked=true;cloudMessage=errorMessage({message:'SAKE_LOG_CONFLICT'})}}else{if(data){if(!validData(data.payload))throw Error('Invalid cloud data');db=data.payload;baseRevision=Number(data.revision)}else{db=blank();baseRevision=0}localWrite();cloudMessage=t('クラウドの記録を読み込みました','Cloud records loaded')}}catch(e){if(seq===epoch){autoBlocked=true;cloudMessage=errorMessage(e)}}finally{if(seq===epoch){authLoading=false;render();scheduleAutoSave()}}}
async function pushCloud(automatic=false){if(!client||!activeUser||cloudBusy||authLoading||(automatic&&autoBlocked))return;clearTimeout(autoTimer);const userId=activeUser.id,seq=epoch;cloudBusy=true;const snapshot=JSON.stringify(db),revision=baseRevision;let retry=false;cloudMessage=t('クラウドに保存中…','Saving to cloud…');updateSyncUI();try{if(new Blob([snapshot]).size>7500000)throw Error(t('写真を含む記録が大きすぎます。写真を減らしてください。','Records are too large. Reduce photos.'));const {data,error}=await client.rpc('sake_log_save',{p_payload:JSON.parse(snapshot),p_expected_revision:revision});if(error)throw error;if(seq!==epoch||activeUser?.id!==userId)return;autoBlocked=false;autoRetries=0;baseRevision=Number(data);dirty=JSON.stringify(db)!==snapshot;try{localWrite()}catch{cloudMessage=t('クラウドには保存済みですが、端末の保存容量が不足しています。','Saved to cloud, but device storage is full.');return}cloudMessage=dirty?t('新しい変更を続けて自動保存します。','Saving newer changes next.'):t('クラウドに保存しました ✓','Saved to cloud ✓')}catch(e){if(seq===epoch){cloudMessage=errorMessage(e);const msg=String(e?.message||e);retry=/fetch|network|timeout|offline/i.test(msg)||Number(e?.status)>=500;if(!retry)autoBlocked=true;cloudMessage=t('クラウド未保存（端末に保持）：','Not saved to cloud (kept on device): ')+cloudMessage}}finally{cloudBusy=false;updateSyncUI();if(seq===epoch&&dirty&&!autoBlocked){if(retry){if(autoRetries<4)scheduleAutoSave(Math.min(30000,2000*2**autoRetries++))}else scheduleAutoSave()}}}
async function pullCloud(){if(!client||!activeUser||cloudBusy)return;if(!confirm(t('クラウドの記録でこのアカウントの端末データを置き換えます。未送信の変更は失われます。必要なら先にバックアップを保存してください。続けますか？','Replace this account’s device data with the cloud copy? Unsaved changes will be lost. Export a backup first if needed. Continue?')))return;const seq=epoch;cloudBusy=true;render();try{const {data,error}=await client.from('sake_log_accounts').select('payload,revision').eq('user_id',activeUser.id).maybeSingle();if(error)throw error;if(seq!==epoch)return;if(!data){cloudMessage=t('クラウドに保存された記録がありません。端末データは変更していません。','No cloud copy exists. Device records have not changed.');return}if(!validData(data.payload))throw Error('Invalid cloud data');db=data.payload;baseRevision=Number(data.revision);dirty=false;autoBlocked=false;autoRetries=0;localWrite();cloudMessage=t('クラウドから読み込みました','Loaded from cloud')}catch(e){cloudMessage=errorMessage(e)}finally{cloudBusy=false;render()}}
function importGuest(){if(!activeUser||cloudBusy||authLoading)return;const guest=readGuest();if(!guest.drinks.length&&!guest.wishlist.length){cloudMessage=t('このブラウザに元の端末記録はありません。最初に記録した画面を開き、プロフィールからバックアップを保存してください。','No original device records in this browser. Open the browser used for your first records and export a backup from Profile.');render();return}if(!confirm(t('端末内モードの記録をこのアカウントに追加しますか？','Add device-mode records to this account?')))return;for(const field of ['drinks','wishlist']){const ids=new Set(db[field].map(x=>x.id));for(const item of guest[field])if(!ids.has(item.id)){db[field].push(clone(item));ids.add(item.id)}}if(save()){cloudMessage=t('取り込みました。自動でクラウドに保存します。','Imported. Saving to cloud automatically.');render()}}
async function logout(){if(cloudBusy)return;if(dirty&&!confirm(t('未送信の変更はこの端末に残ります。ログアウトしますか？','Pending changes will stay on this device. Sign out?')))return;const {error}=await client.auth.signOut({scope:'local'});if(error){authMessage=errorMessage(error);render();return}await loadAccount(null);recovery=false;authMessage='';render()}
async function resetPassword(form){const email=String(new FormData(form).get('email')).trim();if(!email||!form.elements.email.checkValidity()){form.elements.email.reportValidity();return}if(cloudBusy)return;cloudBusy=true;try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});if(error)throw error;authMessage=t('パスワード再設定メールを確認してください。','Check your email for a password reset link.')}catch(e){authMessage=errorMessage(e)}finally{cloudBusy=false;render()}}
async function changePassword(e){e.preventDefault();if(cloudBusy)return;const password=String(new FormData(e.target).get('password'));cloudBusy=true;try{const {error}=await client.auth.updateUser({password});if(error)throw error;recovery=false;authMessage=t('パスワードを更新しました。','Password updated.')}catch(e){authMessage=errorMessage(e)}finally{cloudBusy=false;render()}}
async function initCloud(){if(!window.supabase){authLoading=false;cloudMessage=t('接続ライブラリを読み込めません。再読み込みしてください。端末内モードは使えます。','Connection library unavailable. Reload to sign in. Device mode is available.');render();return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')recovery=true;if(event==='SIGNED_OUT'||event==='PASSWORD_RECOVERY'||(event==='SIGNED_IN'&&activeUser?.id!==session?.user?.id)){setTimeout(()=>loadAccount(session),0)}});try{const {data,error}=await client.auth.getSession();if(error)throw error;await loadAccount(data.session)}catch(e){authLoading=false;cloudMessage=errorMessage(e);render()}}
window.addEventListener('beforeunload',e=>{if(activeUser&&dirty){e.preventDefault();e.returnValue=''}});

function updateSyncUI(){
  drawAccountBar();
  const status=document.getElementById('syncStatus'),pending=document.getElementById('syncDirty');
  if(status)status.textContent=cloudMessage;
  if(pending)pending.textContent=dirty?t('端末に未送信の変更があります','You have changes not saved to cloud'):t('未送信の変更はありません','No pending changes');
}
function scheduleAutoSave(delay=800){
  clearTimeout(autoTimer);
  if(!client||!activeUser||!dirty||autoBlocked||authLoading)return;
  const seq=epoch;
  autoTimer=setTimeout(()=>{
    if(seq!==epoch||!activeUser||!dirty||autoBlocked)return;
    if(cloudBusy){scheduleAutoSave(800);return}
    pushCloud(true);
  },delay);
}
window.addEventListener('online',()=>{autoRetries=0;scheduleAutoSave(100)});
window.addEventListener('focus',()=>{autoRetries=0;scheduleAutoSave(500)});

render();initCloud();

</script></body></html>
